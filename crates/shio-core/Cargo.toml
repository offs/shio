[package]
name = "shio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Download engine used by the Shio desktop application"
publish = false

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true }
librqbit = { workspace = true }

zip = { workspace = true }
sevenz-rust2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
rars = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
rars = { workspace = true, features = ["write"] }
sevenz-rust2 = { workspace = true, features = ["compress"] }
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
