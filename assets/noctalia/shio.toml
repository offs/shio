id = "noctalia"
name = "noctalia"
appearance = "{{ mode }}"

[colors]
background = "{{ colors.surface.default.hex }}"
text_primary = "{{ colors.on_surface.default.hex }}"
text_secondary = "{{ colors.on_surface_variant.default.hex }}"
text_tertiary = "{{ colors.outline.default.hex }}"
accent = "{{ colors.primary.default.hex }}"
success = "{{ colors.error.default.hex | set_saturation 60 | set_hue 145 }}"
warning = "{{ colors.error.default.hex | set_saturation 80 | set_hue 38 }}"
error = "{{ colors.error.default.hex }}"
border = "{{ colors.outline.default.hex }}"
