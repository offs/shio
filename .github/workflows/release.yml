name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notices:
    name: Check version and notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.96.0
      - name: Check Cargo version matches tag
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shio-app") | .version')"
          if [[ "v$cargo_version" != "$VERSION" ]]; then
            echo "tag $VERSION does not match Cargo version $cargo_version" >&2
            exit 1
          fi
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
          fallback: none
      - run: cargo deny check
      - name: Generate third-party notices
        run: |
          mkdir -p notices
          cargo about generate --locked --fail --workspace -c packaging/about.toml -o "$RUNNER_TEMP/crates.md" packaging/about.hbs
          cat packaging/THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/crates.md" > notices/THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notices
          path: notices/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: notices
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static -C control-flow-guard=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.96.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notices
          path: packaging
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
      - run: cargo build --release -p shio-app --locked
      - name: Package MSI
        working-directory: crates/shio-app
        run: |
          New-Item -ItemType Directory -Force -Path ..\..\dist | Out-Null
          wix -ext WixToolset.UI.wixext build -pdbtype none -arch x64 -d "PackageVersion=$($env:VERSION.TrimStart('v'))" -d CargoTargetBinDir=..\..\target\release wix\main.wxs -o ..\..\dist\shio-windows-x64.msi
      - name: Package portable ZIP
        run: |
          $portable = "dist/shio-windows-x64"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item target/release/shio.exe, README.md, LICENSE, packaging/THIRD_PARTY_LICENSES.md $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            dist/*.msi
            dist/*.zip
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: notices
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y appstream build-essential ca-certificates curl desktop-file-utils file git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.96.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notices
          path: packaging
      - run: cargo build --release -p shio-app --locked
      - run: packaging/linux/download-appimage-tools.sh "$RUNNER_TEMP"
      - name: Package AppImage
        shell: bash
        run: |
          LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-x86_64" \
          VERSION="${VERSION#v}" \
            packaging/linux/build-appimage.sh dist/shio-x86_64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            dist/*.AppImage
            dist/*.zsync
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: notices
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.96.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notices
          path: packaging
      - run: cargo build --release -p shio-app --locked
      - name: Package app bundle
        run: |
          contents=dist/shio.app/Contents
          iconset="$RUNNER_TEMP/shio.iconset"
          mkdir -p "$contents/MacOS" "$contents/Resources" "$iconset"
          install -m 755 target/release/shio "$contents/MacOS/shio"
          install -m 644 LICENSE packaging/THIRD_PARTY_LICENSES.md "$contents/Resources/"
          install -m 644 packaging/macos/Info.plist "$contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${VERSION#v}" "$contents/Info.plist"
          plutil -replace CFBundleVersion -string "${VERSION#v}" "$contents/Info.plist"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" assets/icons/icon-256.png --out "$iconset/icon_${size}x${size}.png"
          done
          for size in 16 32 128; do
            sips -z "$((size * 2))" "$((size * 2))" assets/icons/icon-256.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$contents/Resources/shio.icns"
          codesign --force --sign - dist/shio.app
          ditto -c -k --sequesterRsrc --keepParent dist/shio.app dist/shio-macos-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: dist/shio-macos-arm64.zip
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum shio-* THIRD_PARTY_LICENSES.md > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
