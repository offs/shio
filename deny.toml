[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# cargo-deny has no per-ignore expiry; the date in each reason is when to look again.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "review 2027-01-15: unmaintained paste behind iced's wgpu Metal backend" },
    { id = "RUSTSEC-2026-0192", reason = "review 2027-01-15: unmaintained ttf-parser behind iced; parses bundled and system fonts only" },
    { id = "RUSTSEC-2026-0253", reason = "review 2027-01-15: lru 0.16 via iced's cryoglyph; its keys have no panicking Drop" },
    { id = "RUSTSEC-2026-0293", reason = "review 2027-01-15: ringbuf 0.4 via librqbit-utp holds u8, whose Drop cannot panic" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "bzip2-1.0.6",
]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/ikatson/rqbit"]
